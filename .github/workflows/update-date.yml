name: Update Sector Data

on:
  schedule:
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install akshare pandas tqdm -q
          python -c "import akshare; print('akshare version:', akshare.__version__)"

      - name: Show current date and data file status
        run: |
          echo "Today is: $(date +%Y-%m-%d)"
          ls -la public/data/
          head -c 200 public/data/sector_fund_data.json

      - name: Update sector data
        run: |
          python scripts/update_data.py
        continue-on-error: false

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet public/data/sector_fund_data.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No data changes detected."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Data changed! Will commit."
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/sector_fund_data.json
          git commit -m "auto-update: sector fund data $(date +%Y-%m-%d)"
          git push
